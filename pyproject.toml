[project]
name = "vocab_app"
version = "1.0.0"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
preview = true
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security issues)
    "RUF",   # Ruff-specific rules
]
[tool.ruff.lint.per-file-ignores]
"src/infrastructure/tray/tray_macos.py" = ["N802"]  # ObjC protocol
"src/vocab_gui.py" = ["E402"]  # gi.require_version must precede GTK import
"src/windows/*.py" = ["E402"]  # gi.require_version must precede GTK import
"src/infrastructure/tray/tray_linux.py" = ["E402"]  # gi.require_version must precede GTK import
"src/infrastructure/clipboard.py" = ["S404"]  # subprocess used safely
"src/infrastructure/notifications.py" = ["S404"]  # subprocess used safely
"src/infrastructure/tray/__init__.py" = ["RUF067"]  # conditional imports needed
"src/repositories/__init__.py" = ["RUF067"]  # factory registration needed
