name: Update Version

on:
  push:
    branches: [main]

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION file
        run: git rev-parse --short HEAD > VERSION

      - name: Upload VERSION
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: VERSION
